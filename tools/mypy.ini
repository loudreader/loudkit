# Type-check profile for tools/ — operational scripts that build the shipped
# artifacts. They are linted by ruff like src; mypy here still allows untyped
# defs, because these are scripts and not the typed API, but their bodies ARE
# checked and imports ARE followed: with `check_untyped_defs = false` and
# `follow_imports = skip` the profile passed on code that called library
# functions with the wrong types, which is the one thing a tool most often
# gets wrong.
#
# Run as:  mypy --config-file tools/mypy.ini tools/
[mypy]
no_strict_optional = true
allow_untyped_defs = true
allow_untyped_globals = true
check_untyped_defs = true
disallow_untyped_calls = false
follow_imports = normal
ignore_missing_imports = true
