# Type-check profile for the scripts outside the package: tools/, which builds
# the shipped artifacts, and research/, which measures them. Both are linted by
# ruff like src; mypy here still allows untyped
# defs, because these are scripts and not the typed API, but their bodies ARE
# checked and imports ARE followed: with `check_untyped_defs = false` and
# `follow_imports = skip` the profile passed on code that called library
# functions with the wrong types, which is the one thing a tool most often
# gets wrong.
#
# `no_strict_optional` used to be set here too, and it was hiding seven real
# errors, two of them exporters passing `None` where the runtime types a
# `VoiceProfile`. `warn_unused_ignores` was not set, so 22 `type: ignore`
# comments suppressed nothing while standing ready to hide a future error, the
# case `docs/design/typing.md` calls worse than nothing. Both are on now, every
# module included, and the errors they were covering are fixed rather than
# re-suppressed.
#
# What is still loose, deliberately: untyped defs, untyped globals and untyped
# calls. These are scripts with argparse mains and torch modules whose `forward`
# takes whatever the tracer hands it; annotating those buys nothing the body
# check does not already give. `disallow_any_generics`, `warn_return_any` and
# `strict_equality` stay off for the same reason, outside `release` below.
#
# `mypy_path` names this checkout's package. Without it the profile resolves
# `loudkit` through the venv's editable install, which points at whichever
# checkout was installed, so the gate reports on a tree nobody is editing: a
# worktree whose package has a symbol the installed one lacks fails here for
# no reason, and one that lost a symbol passes.
#
# Run as:  mypy --config-file tools/mypy.ini tools/ research/
[mypy]
mypy_path = python
allow_untyped_defs = true
allow_untyped_globals = true
check_untyped_defs = true
disallow_untyped_calls = false
follow_imports = normal
ignore_missing_imports = true
warn_unused_ignores = true

# The package is checked, strictly, by `mypy python/loudkit`. Its types are
# read here so a tool calling a library function with the wrong types is
# caught, but its bodies are not re-checked under these looser flags: an
# ignore the strict profile needs reads as unused under this one.
[mypy-loudkit,loudkit.*]
follow_imports = silent

# tools/release/ assembles, audits and verifies what users download, so it is
# held to the flags `--strict` implies rather than to the script profile above.
# This is not an aspiration: the package already passed
# `mypy --strict --ignore-missing-imports tools/release/` clean and was being
# checked loosely anyway. Stated here so it stays that way.
[mypy-release,release.*]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
