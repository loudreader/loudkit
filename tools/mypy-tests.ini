# Type-check profile for the part of the suite that guards the release chain.
#
# `tests/` is 66 modules and no profile has ever read them, so the whole
# directory carries hundreds of errors: fakes reached for by attribute,
# fixtures typed `object`, argument dicts splatted into typed calls. Annotating
# all of it is a project; a gate over a tenth of it that runs today is worth
# more than a plan to cover the rest, so `files` below is an explicit list and
# grows one module at a time.
#
# What is on the list, and why these: everything that decides what a user
# downloads and what the five ports have to agree about. A type error in a test
# of that surface is not cosmetic, because the failure it hides is a test that
# passes while asserting nothing -- a fake whose attribute nobody reads, a
# fixture handed the wrong shape. `assets.py` and `conftest.py` are here
# because every listed module builds on them.
#
# What is deliberately left off: the engine, model, server, MCP, CLI and
# backend suites. Those are where the untyped fakes live in bulk, they are not
# on the download path, and adding them means annotating rather than checking.
#
# Flags are `tools/mypy.ini`'s, for the same reason it gives: untyped defs stay
# allowed, because a test body is not the typed API and `def test_x(tmp_path)`
# is the pytest idiom; the bodies ARE checked and imports ARE followed, which
# is where the errors that matter live.
#
# Run as:  mypy --config-file tools/mypy-tests.ini
[mypy]
allow_untyped_defs = true
allow_untyped_globals = true
check_untyped_defs = true
disallow_untyped_calls = false
follow_imports = normal
ignore_missing_imports = true
warn_unused_ignores = true
mypy_path = python
files =
  tests/assets.py,
  tests/conftest.py,
  tests/test_conformance.py,
  tests/test_download_resolver.py,
  tests/test_frozen_formats.py,
  tests/test_hub.py,
  tests/test_hygiene.py,
  tests/test_provenance.py,
  tests/test_release.py,
  tests/test_release_coherence.py,
  tests/test_security_pins.py,
  tests/test_synthesis.py,
  tests/test_transport_resolution.py,
  tests/test_wav_parity.py

# The package is checked, strictly, by `mypy python/loudkit`. Its types are
# read here and its errors are not reported here: these flags are looser than
# that gate's, so a `type: ignore` the strict run needs reads as unused under
# this one, and the same line would then have to satisfy both.
[mypy-loudkit,loudkit.*]
follow_imports = silent
