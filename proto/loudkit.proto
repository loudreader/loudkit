// loudkit over gRPC, the third transport over the same synthesis path.
//
// The HTTP server, the MCP server and this one all call `render_bytes` and
// `render_stream_chunks` and do nothing else with audio. Audio is made in one
// place, so no transport has its own speed, language or prefix handling.
//
// The contract mirrors the HTTP one field for field. The field names are the
// names `/v1/synthesize` uses.
syntax = "proto3";

package loudkit.v1;

// The engine is single-flight, so `Synthesize` and `SynthesizeStream` can both
// answer RESOURCE_EXHAUSTED: either too many callers are already waiting for
// the engine, or this one waited and never got in. Both mean "come back", not
// "the request was wrong" - retry with backoff. The server refuses early on
// purpose: a caller parked on a waiting thread is a thread `ListVoices` and
// `Describe` cannot be answered with, and those need no engine at all.
//
// Every refusal this server decides carries `loudkit-error-code` in its
// trailing metadata: the same frozen vocabulary the HTTP bodies carry as
// `"code"`, because gRPC status codes are coarser than the conditions
// (INVALID_ARGUMENT covers a dozen refusals). Branch on the metadata, treat
// the status as the class of answer. One refusal is decided below the server:
// a request message over the 256 KiB transport limit is refused by gRPC core
// as RESOURCE_EXHAUSTED before a servicer exists, so that one arrives with
// core's own message and no `loudkit-error-code` - there is no frame left to
// attach it from.
//
// Cancelling a call, or letting its deadline expire, stops the work - on
// `Synthesize` and `SynthesizeStream` alike. The server wires both to the
// engine's own cancel flag, and a deadline that expires while a call is still
// waiting for the engine means the engine is never taken at all.
// `SynthesizeStream` also has a server-side cap on how long one stream may
// hold the engine, and reports DEADLINE_EXCEEDED when it fires.
//
// Cancellation is cooperative, not preemptive. The flag is polled on every
// token decode step, which is where nearly all the time goes, but it cannot
// interrupt a backend kernel already executing: a mel decode, a vocoder pass
// or a time-stretch that has entered its backend call runs to the end of that
// call before the flag is read again. A cancel is honoured within one such
// step, not within zero.
service Speech {
  // One utterance, one reply. Same text, voice and seed give the same samples,
  // and the same bytes in every format but ogg and opus.
  rpc Synthesize(SynthesizeRequest) returns (SynthesizeResponse);

  // The same passage as a stream of chunks, in the order they are read.
  //
  // A reading app starts playing on the first chunk instead of waiting for the
  // last. Every chunk is a *complete, standalone* payload in `audio_format` -
  // its own header, playable on its own - so the chunks do not concatenate
  // byte-wise into what `Synthesize` returns: join them with a decoder, or play
  // them in order. What does hold across the two RPCs is the reading itself:
  // the chunks' `token_count` sums to the unary reply's, and the last chunk's
  // `continuation` is the unary reply's `continuation`.
  //
  // This RPC always splits at sentence boundaries. `long_form` is a question
  // only `Synthesize` answers, and is ignored here.
  //
  // Prefer it for a long passage whatever the client is doing with the audio:
  // one message per chunk stays under the 4 MiB a default client accepts, and
  // `Synthesize` refuses a request whose reply obviously would not (see
  // `text`).
  rpc SynthesizeStream(SynthesizeRequest) returns (stream SynthesizeChunk);

  // The resolved algorithm and execution config — the line every run should be
  // able to answer about itself, and the one that makes two builds comparable.
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  // Names the server can speak in.
  rpc ListVoices(ListVoicesRequest) returns (ListVoicesResponse);
}

message SynthesizeRequest {
  // At most 10 000 characters, refused as INVALID_ARGUMENT. The transport also
  // caps the whole request message at 256 KiB. gRPC core refuses a larger
  // message as RESOURCE_EXHAUSTED before it is parsed, with core's own message
  // and no `loudkit-error-code` (see the service comment).
  //
  // `Synthesize` also refuses a shorter text when its reply would exceed the
  // 4 MiB a default gRPC client accepts. The client sets that limit, so the
  // server cannot raise it. The estimate uses the text as it will be spoken:
  // the normalisation funnel expands digits, dates and symbols into words, so
  // a thousand characters of digits are minutes of audio. It reserves headroom
  // for the WAV header, the provenance manifest and protobuf framing. The
  // refusal names the length that would fit and points at `SynthesizeStream`,
  // which sends one message per chunk.
  string text = 1;
  // A voice *name*, resolved in the server's library. A filesystem path is
  // refused, so a caller cannot reach a profile outside the library.
  string voice = 2;
  uint64 seed = 3;

  // Empty means "read it in the voice's own language". Set it only to read
  // text in a language the voice was not enrolled in. The engine applies the
  // argument-then-voice-then-"en" chain; this transport passes the value on.
  string language = 4;

  // Playback speed in [0.5, 2.0], pitch preserved. Absent means 1.0, which
  // leaves the audio unchanged. A value outside the range is INVALID_ARGUMENT,
  // refused before the engine is taken. It is not clamped.
  //
  // `optional` gives the field presence. proto3's default for a double is 0.0,
  // so without it an explicit 0.0 would look like an absent field, and this
  // transport would render a request the HTTP and MCP transports refuse.
  // `long_form` below needs presence for the same reason.
  optional double speed = 5;

  // Split a long passage at sentence boundaries instead of refusing it.
  // `Synthesize` only: `SynthesizeStream` always splits.
  //
  // `optional` gives the field presence. proto3's default for a bool is false
  // and the library's default is true, so without it a request that omits the
  // field would take the other path and give different audio from every other
  // transport.
  optional bool long_form = 6;

  // The previous reply's `continuation`, to chain calls without an audible
  // restart at each join.
  repeated int32 previous_tokens = 7;

  // "wav" (default), "pcm16", "flac", "ogg", "mp3" or "opus". Empty means
  // wav; any other name is INVALID_ARGUMENT listing the six that work.
  //
  // SynthesizeStream takes the first three. An Ogg bitstream's state spans
  // the whole stream, and each MP3 chunk carries its own encoder delay, so a
  // separate container per chunk would not join into one passage. ogg, mp3 and
  // opus are INVALID_ARGUMENT there, pointing at Synthesize.
  // `/v1/synthesize/stream` refuses them in the same words.
  string audio_format = 8;
}

message SynthesizeResponse {
  bytes audio = 1;
  string media_type = 2;
  double duration_seconds = 3;
  uint32 token_count = 4;

  // True when generation stopped at the token cap instead of at a stop token:
  // the speech is cut off mid-sentence. Check it, because the audio is valid
  // either way.
  bool truncated = 5;

  // The tail to pass back as `previous_tokens` on the next call.
  repeated int32 continuation = 6;

  // The algorithm fingerprint this was rendered under. Two servers that answer
  // the same request with different fingerprints run different engines, so
  // compare this before you compare audio.
  string fingerprint = 7;

  // Samples per second of the audio. wav, flac, ogg, mp3 and opus record it in
  // their own headers. Raw pcm16 frames have no header, so a pcm16 caller reads
  // the rate from this field. It is set for every format, so no caller has to
  // parse a container, as the HTTP server always sends X-Loudkit-Sample-Rate.
  uint32 sample_rate = 8;
}

message SynthesizeChunk {
  // One complete file in `audio_format`, with its own header. A chunk plays on
  // its own. To join two chunks, decode them; do not concatenate their bytes.
  bytes audio = 1;
  string media_type = 2;
  double duration_seconds = 3;
  uint32 token_count = 4;

  // True when *this chunk* stopped at the token cap instead of at a stop
  // token. The field is per chunk. For the whole passage, OR it across the
  // chunks you received; the unary RPC reports that in one field.
  bool truncated = 5;

  // The passage's tail as of this chunk: the ids to pass back as
  // `previous_tokens` to continue from here. The tail is cumulative, because a
  // chunk can be shorter than the prefix the engine conditions on: a two-token
  // closing sentence carries a tail that reaches back into the chunk before
  // it. A client that stops reading mid-passage chains from the last chunk it
  // received. The final chunk's value equals `Synthesize`'s `continuation` for
  // the same request, whatever the length of the last chunk.
  repeated int32 continuation = 6;
  string fingerprint = 7;

  // Samples per second, on every chunk for the same reason
  // `SynthesizeResponse` carries it: raw pcm16 has no header to read it from.
  uint32 sample_rate = 8;
}

message DescribeRequest {}

message DescribeResponse {
  string algorithm = 1;
  string execution = 2;
  string fingerprint = 3;
  string version = 4;

  // How long the engine has been held by one request, in seconds; 0 when it is
  // free. `Describe` does not take the engine lock, so it answers while a
  // synthesis is in flight.
  //
  // A cancel, an expired deadline and the server's own stream cap all stop the
  // render within a decode step, and this value then falls back to 0. That
  // includes a client that stays connected and stops *reading*: a bounded
  // queue separates production from the socket, so a stalled peer stalls only
  // delivery, the render stops at the cap and the engine comes back. A value
  // that keeps growing past the cap means a render is stuck inside a backend
  // kernel, which cooperative cancellation cannot interrupt. The HTTP server
  // reports the same condition on `/health` as "stuck".
  double engine_held_seconds = 5;
}

message ListVoicesRequest {}

message ListVoicesResponse {
  repeated string voices = 1;
}
