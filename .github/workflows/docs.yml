# The documentation lives on Vercel at https://loudkit.loudreader.io/.
# GitHub Pages only preserves the URLs of the retired project site. Keep this
# workflow on main so a future docs change cannot republish the duplicate site.
name: docs

on:
  push:
    branches: [main]
    paths:
      - site/scripts/legacy-redirects.mjs
      - site/scripts/legacy-redirects.test.mjs
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - site/scripts/legacy-redirects.mjs
      - site/scripts/legacy-redirects.test.mjs
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: legacy URL redirects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - name: Test legacy URL mapping and fragment preservation
        run: node --test site/scripts/legacy-redirects.test.mjs
      - name: Check live destinations and generate redirects
        run: node site/scripts/legacy-redirects.mjs --check-targets
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/legacy-dist

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
