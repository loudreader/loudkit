# Release build — the artifact assembly half of the release step.
#
# On a version tag, build the sdist + wheel, verify them (the no-weights
# suite, plus an import-and-synthesise smoke from *both* built artefacts in
# clean venvs), attest their provenance, and hand them to the jobs below.
#
# The order of the graph is the whole design, so it is written out here:
#
#   tag-gate
#      ↓
#   build
#     ├─ attest ──────┐
#     ├─ check-pypi ──┤
#     ├─ check-npm ───┤
#     └─ check-crates ┘
#                     ↓
#              [ human approves the `release` environment ]
#                     ↓
#            publish-npm → publish-pypi → publish-crates → github-release
#
# **`tag-gate` ties the tag to this repository's own history and checks.** A
# `v*` tag is just a name for a commit; nothing else in this repository stops
# one from pointing at a branch, or at a commit whose CI never ran. The gate
# refuses a tag whose commit is not on `main`, and refuses one without a green
# `ci` run carrying a successful `parity` job for that exact SHA. No external
# ruleset is relied on for either check; if one is added later it is a second
# fence, not a replacement for this one.
#
# **`attest` is the only job holding `id-token: write` outside the two
# Trusted Publishing jobs, and it runs no fetched tooling.** The build job
# installs third-party packages from PyPI and runs the test suite, which is
# exactly the code an OIDC-minting job must not run: a compromised dependency
# there could sign whatever it liked. So the build job has `contents: read`
# and nothing else, and the attestation happens in a separate job that only
# downloads the built artefacts and signs them.
#
# **Nothing is published until every registry has said it would accept the
# artefact.** The three `check-*` jobs run each registry's own acceptance
# check — `twine check --strict`, `npm pack`, `cargo package` — against the
# bytes the publish jobs will send. A packaging defect that only PyPI can see
# has to surface while all three ecosystems are still untouched, because after
# the first upload it cannot be undone by fixing it.
#
# **A check is only worth the artefact it inspects**, which is why each of the
# three names the same bytes twice rather than once:
#
#   - PyPI: `build` uploads `dist/` as a workflow artifact, and both
#     `check-pypi` and `publish-pypi` download that one copy.
#   - npm: `check-npm` packs the `.tgz`, uploads it, and `publish-npm`
#     publishes that exact file. It does not rebuild.
#   - crates.io: `check-crates` runs `cargo package`, unpacks the resulting
#     `.crate` outside the checkout, and builds and tests what a consumer of
#     `cargo add loudkit` actually gets. crates.io has no upload-this-file
#     call, so `publish-crates` must repackage — but it repackages *with*
#     verification, so the tarball it uploads is built before it is sent.
#
# **The gate is the `release` GitHub environment**, configured to require a
# reviewer. Every publish job names it, so a tag builds and verifies on its
# own and then waits for a person before anything leaves the repository.
#
# That wall is not ceremony. Publishing is the one irreversible act in the
# release: crates.io never frees a yanked version, PyPI never reuses a number,
# and npm allows an unpublish for 72 hours and not a minute more. A wrong tag
# without the wall is a burned version number in three ecosystems at once.
#
# **The publish jobs are chained, not parallel**, in the order RELEASING.md §7
# gives: npm, then PyPI, then crates.io. That is most reversible to least, so
# each link only runs because the one before it did not fail.
#
# **Every published artefact carries provenance, the first one included.** The
# wheel and the sdist are signed by `attest`, and npm's own attestation is
# minted by `publish-npm`. The awkward case is the very first npm publish: a
# trusted publisher can only be attached to a package the registry already
# has, so version one cannot use OIDC and something has to stand in for it.
# What stands in is a granular token in the `NPM_BOOTSTRAP_TOKEN` secret, read
# by that same job, on that same approval, sending that same tarball, with
# `--provenance` passed explicitly. Nobody publishes from a laptop, and the
# artefact everyone installs first is not the one artefact with nothing behind
# it. The secret is deleted as soon as the trusted publisher exists;
# RELEASING.md §7.1 is the sequence and says when each credential is created
# and when it is revoked.
#
# **The GitHub Release is created last**, and only because `publish-crates`
# succeeded. It used to be written by the build job, which meant a release a
# human had never approved already existed under the tag, carrying artefacts
# that might never be published. Last is also where it costs least to be
# wrong: a GitHub Release can be deleted, and none of the three registries
# can. It needs no `environment:` of its own — it cannot start until the three
# gated jobs have run, so it is already downstream of the approval, and adding
# the environment would only ask the reviewer a fourth time.
#
# Hugging Face is not here. The weights are uploaded by hand, deliberately.
#
# Go has no publish step and needs none: `go get` resolves straight from the
# tag through proxy.golang.org. Note that the proxy caches immutably, so the
# `go/v0.1.0` tag is the last one to push, never the first.
#
# **Actions are pinned to commit SHAs, not tags, and the Python tooling is
# pinned to versions.** A tag is a movable pointer in someone else's
# repository: `@v4` today and `@v4` after a compromise are the same string and
# different code. `pip install build` is the same problem in the other package
# manager, which is one half of why the job that runs it holds no OIDC token
# (the `attest` job above is the other half). The comment beside each pin
# records which tag it was, so an upgrade stays a readable diff.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default, and every job widens this to exactly what it needs.
# The build job in particular does not get `contents: write`: it produces
# artefacts and an attestation and writes nothing to the repository, and it is
# the job that installs third-party tooling.
permissions:
  contents: read

jobs:
  # The job always runs so `needs: tag-gate` never skips the graph, and its
  # steps only bite on a `v*` tag: a `workflow_dispatch` build has no tag to
  # hold to account, and its publish jobs are tag-gated anyway.
  tag-gate:
    name: the tag points at green main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read       # to read this repository's ci runs for the SHA
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          # Full history: ancestry cannot be decided from a shallow clone.
          fetch-depth: 0

      - name: The tagged commit is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main." >&2
            echo "Releases are cut from main only; retag after the merge." >&2
            exit 1
          fi
          echo "$GITHUB_SHA is an ancestor of origin/main"

      - name: ci ran green, parity included, for this exact commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A successful `ci` run alone is not enough: `parity` is the job
          # that measures the weights, it runs conditionally, and a run in
          # which it was skipped still concludes `success`. So the gate walks
          # the successful runs for this SHA and requires one whose parity
          # job itself succeeded. A tag pushed before ci finishes fails here;
          # re-run this workflow once ci is green.
          found=""
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
                        --commit "$GITHUB_SHA" --status success \
                        --json databaseId --jq '.[].databaseId'); do
            if gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs \
                 --jq '.jobs[] | select(.name | startswith("parity")) | .conclusion' \
               | grep -qx success; then
              found="$id"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "no successful ci run with a green parity job exists for $GITHUB_SHA" >&2
            echo "wait for ci (including parity) to pass on main, then re-run" >&2
            exit 1
          fi
          echo "ci run $found is green for $GITHUB_SHA, parity included"

  build:
    name: build sdist + wheel
    needs: tag-gate
    runs-on: ubuntu-latest
    # `contents: read` and nothing more. This job installs tooling from PyPI
    # and runs the test suite; it must not be able to mint an OIDC token or
    # write an attestation. The `attest` job below signs what this job built.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install --upgrade pip "build==1.5.0"

      # The tag is what people install; the version is what the artefact says
      # it is. When they disagree, `pip install loudkit==0.1.0` fetches
      # something built from a tree tagged v0.2.0 and no error is ever raised —
      # the release is unfalsifiable after the fact. Checked before the build,
      # because there is no point producing artefacts that must be discarded.
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "
          import tomllib
          print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])
          ")
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME declares version $tag, but pyproject.toml says $version"
            exit 1
          fi
          echo "tag and version agree: $version"

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify the wheel carries the data and py.typed
        # The Polish respelling lexicon ships in the wheel; losing it would
        # make Polish text read differently from the source checkout.
        run: |
          python -c "
          import zipfile, glob
          whl = glob.glob('dist/*.whl')[0]
          z = zipfile.ZipFile(whl)
          names = z.namelist()
          assert any('pl_en_respell.json' in n for n in names), 'lexicon missing from wheel'
          assert any('py.typed' in n for n in names), 'py.typed missing from wheel'
          print('wheel OK:', whl)
          "

      - name: Smoke-test both artefacts in clean venvs
        # Import and exercise the weight-free path from each installed
        # artefact, not the source tree — the assembly must work on its own.
        #
        # The **sdist** matters as much as the wheel and used to go untested:
        # it is what a distro packager, a `--no-binary` install and any
        # platform without a matching wheel actually build from, and it is
        # exactly where an over-narrow `only-include` allowlist shows up. A
        # wheel that works proves nothing about a source tree that cannot.
        run: |
          set -euo pipefail
          for artefact in dist/*.whl dist/*.tar.gz; do
            name=$(basename "$artefact")
            rm -rf "/tmp/venv-$name"
            python -m venv "/tmp/venv-$name"
            "/tmp/venv-$name/bin/pip" install --quiet "$artefact"
            "/tmp/venv-$name/bin/python" -c "
          import loudkit
          from loudkit.rng import philox_4x32_10
          from loudkit.frontend.polish import lexical_respelling
          assert lexical_respelling('download', 'pl') == 'dałnloud'
          print('installed OK:', loudkit.__version__)
          "
            echo "$name is installable and importable"
          done

      - name: Run the no-weights test suite from the source checkout
        run: |
          python -m pip install --quiet -e ".[dev]"
          pytest -m "not slow" -q

      # An SBOM and a signed provenance statement are how someone who did not
      # build these artefacts can tell what is in them and where they came
      # from. Without them the only answer to "is this really loudkit v0.1?"
      # is "it says so on the tin", which is the same answer a substituted
      # artefact gives.
      - name: Generate an SBOM for the artefact, not the runner
        # `cyclonedx_py environment` describes the interpreter it is pointed at.
        # Pointed at *this* one it listed pytest, mypy, ruff, build and whatever
        # else the job had installed — a bill of materials for the CI runner,
        # published as if it were the wheel's. It is pointed at a clean venv
        # holding only the wheel and its declared dependencies.
        #
        # It is written to `sbom/`, **not** `dist/`. `dist/` is handed whole to
        # the PyPI publish action, which refuses anything that is not a
        # distribution: `twine check` on a directory holding the JSON answers
        # `InvalidDistribution: Unknown distribution format`. The SBOM reaches
        # readers through the GitHub Release instead, which is where someone
        # asking what is in the wheel would look for it.
        run: |
          set -euo pipefail
          mkdir -p sbom
          rm -rf /tmp/venv-sbom
          python -m venv /tmp/venv-sbom
          /tmp/venv-sbom/bin/pip install --quiet --upgrade pip
          /tmp/venv-sbom/bin/pip install --quiet \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            "$(ls dist/*.whl)"
          python -m pip install --quiet "cyclonedx-bom==7.3.1"
          python -m cyclonedx_py environment /tmp/venv-sbom \
            --output-format json --outfile sbom/loudkit-sbom.cdx.json
          python - <<'PY'
          import json
          sbom = json.load(open("sbom/loudkit-sbom.cdx.json"))
          names = {c["name"].lower() for c in sbom["components"]}
          # The runner's tooling must not appear: its presence means the SBOM
          # describes the machine that built the wheel, not the wheel.
          leaked = names & {"pytest", "mypy", "ruff", "build", "cyclonedx-bom", "pytest-cov"}
          assert not leaked, f"SBOM describes the CI environment: {sorted(leaked)}"
          assert "loudkit" in names, "SBOM does not contain loudkit itself"
          print(f"SBOM: {len(sbom['components'])} components, none from the runner")
          PY

      # `dist/` must hold distributions and nothing else, because that is what
      # is uploaded to PyPI. Asserted rather than assumed: the SBOM lived here
      # once, and the check that would have caught it is one line.
      - name: dist/ holds distributions and nothing else
        run: |
          set -euo pipefail
          strays=$(ls dist | grep -Ev '\.whl$|\.tar\.gz$' || true)
          if [ -n "$strays" ]; then
            echo "dist/ carries files PyPI cannot accept:" >&2
            echo "$strays" >&2
            exit 1
          fi
          ls dist

      # The publish job installs exactly these bytes, rather than rebuilding.
      # A second build could differ from the one that was tested and attested,
      # and the difference would reach the registry unexamined.
      - name: Hand the built artefacts to the publish jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Hand the SBOM to the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom
          path: sbom/*
          if-no-files-found: error

  # The attestation is minted in its own job, because `id-token: write` is the
  # ability to sign as this repository and the build job runs code fetched
  # from the network (pip-installed tooling, the test suite, npm and cargo in
  # the check jobs). This job runs none of that: no checkout, no installs,
  # only the pinned attestation action over the bytes the build job handed
  # over. What it signs is therefore exactly what was built, and nothing that
  # ran during the build could have held the signing token.
  attest:
    name: attest build provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # provenance attestation signs via OIDC
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: "dist/*.whl,dist/*.tar.gz"

  # --- the dry runs, before anything is published ----------------------------
  #
  # Each of these asks one registry the question it would answer at upload
  # time, and none of them is gated: they are the evidence the reviewer is
  # approving. All three must pass before the first publish job can start.

  check-pypi:
    name: PyPI accepts the distributions
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      # The same validation the upload performs, run where a failure costs
      # nothing. It reads the metadata and the long description out of both
      # artefacts and refuses anything PyPI's own renderer would refuse.
      - name: twine check
        run: |
          set -euo pipefail
          python -m pip install --quiet "twine==7.0.0"
          python -m twine check --strict dist/*

  check-npm:
    name: npm accepts the tarball
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"

      # The tag is what people install; package.json is what npm records. A
      # mismatch here publishes a version nobody asked for, under a number that
      # can never be reused.
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./js/package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match js/package.json $pkg" >&2
            exit 1
          fi

      # `npm pack` runs `prepack`, which builds and then refuses a package
      # missing dist/ or the respelling lexicon. `--dry-run` would run the same
      # guard and then throw the tarball away, leaving publish-npm to build a
      # second one that nothing had looked at. This writes the real file, and
      # publish-npm sends this file.
      #
      # It is packed into RUNNER_TEMP rather than `js/`, so a `.tgz` cannot end
      # up inside a later `npm pack`'s idea of the package directory.
      - name: Build, test and pack
        working-directory: js
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm test
          npm pack --pack-destination "$RUNNER_TEMP/npm"

      - name: Record what the tarball carries
        run: |
          set -euo pipefail
          tarball=$(ls "$RUNNER_TEMP"/npm/*.tgz)
          echo "packed $tarball"
          sha256sum "$tarball"
          tar -tzf "$tarball"

      # A listing proves the files are in the tarball; it does not prove they
      # work from there. This installs the exact `.tgz` that publish-npm will
      # send into a clean directory, the way a consumer's `npm install
      # loudkit` lands it, and imports it. The respelling call is the same
      # smoke the Python artefacts get: it only answers correctly if the
      # shipped data files resolve from the installed location, which is
      # precisely what running from the source checkout can never test.
      - name: Install the tarball as a consumer and import it
        run: |
          set -euo pipefail
          tarball=$(ls "$RUNNER_TEMP"/npm/*.tgz)
          consumer="$RUNNER_TEMP/npm-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init --yes >/dev/null
          npm install --no-audit --no-fund "$tarball"
          node --input-type=module -e "
          import { Engine, LRSamplerV1, lexicalRespelling } from 'loudkit';
          const got = lexicalRespelling('download', 'pl');
          if (got !== 'dałnloud') {
            throw new Error('respelling data missing or wrong: ' + got);
          }
          console.log('installed tarball imports OK:', typeof Engine, typeof LRSamplerV1);
          "

      # The bytes that were just checked, handed to the job that holds the
      # credentials. Without this the check and the publish are two builds of
      # the same source, and only the first one was ever inspected.
      - name: Hand the tarball to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error

  check-crates:
    name: crates.io accepts the crate
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: stable

      - name: The tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          if [ "$tag" != "$crate" ]; then
            echo "tag $tag does not match rust/Cargo.toml $crate" >&2
            exit 1
          fi

      # What a consumer gets is the `.crate` tarball, not this checkout, and
      # the two are not the same tree: `include` in Cargo.toml is an allowlist,
      # so anything outside it is silently absent from the tarball while still
      # sitting on disk here. A check that compiles the checkout cannot see
      # that. This one compiles the tarball.
      #
      # Three steps, each catching something the one before it cannot:
      #
      #   1. `cargo package` builds its own staging copy of the packaged
      #      contents. That is the step `--no-verify` used to skip, which is
      #      what let a crate that does not compile from its own tarball pass.
      #   2. The `.crate` is unpacked *outside* the checkout, so a path that
      #      only resolves next to the monorepo cannot resolve by accident.
      #   3. That unpacked tree is built and tested, which is the closest this
      #      workflow can get to running `cargo add loudkit` in a stranger's
      #      project.
      #
      # Steps 1 and 3 are two compiles of the same source, and they cost about
      # one: `CARGO_TARGET_DIR` is shared, so the dependency graph — `ort`,
      # `ndarray`, `regex`, `sha2` — is built once and only loudkit's own
      # twenty files are compiled twice. Paying that twice is worth not having
      # to argue about which of the two trees is authoritative.
      - name: Package the crate, then build and test what it contains
        working-directory: rust
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
        run: |
          set -euo pipefail

          # --locked, because the lockfile ships inside the crate: if it cannot
          # satisfy the manifest, the consumer finds out and not us.
          cargo package --locked

          crate=$(ls target/package/*.crate)
          echo "packaged $crate"
          sha256sum "$crate"
          tar -tzf "$crate"

          unpacked="$RUNNER_TEMP/crate"
          mkdir -p "$unpacked"
          tar -xzf "$crate" -C "$unpacked"
          cd "$unpacked"/loudkit-*

          cargo build --locked --all-targets

          # `src/chunking.rs` carries a `#[cfg(test)]` test that reads the
          # shared conformance fixture, and the fixture is not in the crate:
          # `include` ships `src/**` and the fixture lives at the monorepo
          # root. Without this variable the test looks for `../tests/data`
          # relative to the unpacked tree and fails on a missing file, which
          # says nothing about the crate. Pointed at the checkout it says what
          # it was written to say. (The integration tests under `rust/tests`
          # are excluded from the package for the same reason and so do not
          # run here; Cargo.toml records that choice.)
          #
          # Two ways this test run is *not* what a consumer gets, both
          # deliberate and both compensated below: the fixture path reaches
          # back into this monorepo, and `--locked` resolves dependencies
          # from a lockfile a `cargo add loudkit` consumer never sees.
          LOUDKIT_FIXTURE_DIR="${{ github.workspace }}/tests/data/conformance" \
            cargo test --locked

      # The closest available imitation of `cargo add loudkit` before the
      # crate exists on crates.io: a brand-new binary crate, outside the
      # checkout, depends on the unpacked package contents, resolves its
      # dependency graph fresh from the registry (no --locked, no shipped
      # lockfile, which is how every consumer resolves a library), and calls
      # the public API.
      #
      # What this still cannot cover, recorded so nobody reads more into the
      # green than it holds: the bytes crates.io will actually serve and
      # index (only a publish creates those), version resolution of
      # `loudkit = "0.1"` through the registry, and the fixture-backed tests
      # above, which need data no consumer has.
      - name: A fresh crate depends on the package and calls it
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/crate-consumer"
          cargo new --bin "$consumer" --name smoke
          unpacked=$(cd "$RUNNER_TEMP"/crate/loudkit-* && pwd)
          cd "$consumer"
          cargo add loudkit --path "$unpacked"
          cat > src/main.rs <<'RS'
          fn main() {
              let got = loudkit::respell::lexical_respelling("download", "pl");
              assert_eq!(got, "dałnloud", "respelling data missing or wrong");
              let n = loudkit::chunking::estimate_tokens("The release is assembled.");
              assert!(n > 0);
              println!("consumer crate calls loudkit OK: {n} tokens estimated");
          }
          RS
          cargo run

  # --- publishing ------------------------------------------------------------
  #
  # Every job below needs a reviewer on the `release` environment before it
  # runs, and every one of them is irreversible once it does.
  #
  # PyPI and npm authenticate over OIDC (Trusted Publishing): there is no token
  # in this repository's secrets for either, so there is none to leak or
  # rotate. crates.io has no equivalent yet and takes a token.
  #
  # Registry-side setup is a human act and is recorded in RELEASING.md.

  publish-npm:
    name: publish to npm
    # `attest` is in the list so nothing can publish before the artefacts are
    # signed: an attestation that appears after the upload attests nothing.
    needs: [attest, check-pypi, check-npm, check-crates]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Both routes below need it, for related reasons. Trusted Publishing
      # exchanges the OIDC token for a short-lived publish token and signs the
      # provenance attestation with the same identity. The bootstrap
      # authenticates with a token instead, but `--provenance` still mints the
      # statement over this repository's OIDC identity: without this
      # permission npm refuses with "Provenance generation in GitHub Actions
      # requires 'write' access to the 'id-token' permission".
      id-token: write
    # The one bit that chooses between the two routes. `secrets` is not a
    # context that a job-level or a step-level `if:` can read, and it is not
    # read here either: the value is lifted into the environment, where the
    # script can ask whether it is empty. Present means the package does not
    # exist on npm yet and this run is the bootstrap; absent is every release
    # after it. Absent is the resting state: RELEASING.md §7.1 has the owner
    # delete the secret as soon as the trusted publisher is configured.
    env:
      NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
    steps:
      # No checkout, and no build. The tarball check-npm packed is the tarball
      # that is published, so there is no source tree here to build a different
      # one from. `npm publish <file>.tgz` does not run `prepack` — the guard
      # already ran, on these bytes, in check-npm.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: npm-tarball
          path: npm-tarball

      # `registry-url:` is deliberately absent. Given it, setup-node writes an
      # `.npmrc` containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`,
      # and npm reads a configured `_authToken` — even one expanding to nothing,
      # which is what it expands to here — as "auth is already arranged" and
      # never starts the OIDC exchange. The publish then fails with ENEEDAUTH.
      # https://registry.npmjs.org is npm's built-in default, so writing it down
      # buys nothing and costs the handshake. The bootstrap route does not want
      # it either: it writes its own config file, for one command, and deletes
      # it, rather than leaving an auth line in the runner's `.npmrc` for every
      # later step to inherit.
      #
      # Node 24, because it bundles an npm new enough for Trusted Publishing
      # (the floor npm documents is npm 11.5.1 with Node 24; see
      # https://docs.npmjs.com/trusted-publishers/). This job used to run
      # `npm install --global npm@11.19.0` on top of Node 22, which fetched
      # and executed registry code *after* `id-token: write` was granted —
      # exactly what the `attest` job exists to avoid. Nothing is installed
      # here any more: the npm that publishes is the one the pinned setup-node
      # action provides. `cache:` stays absent for the same reason — a
      # publishing job restores no cached dependencies.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24"

      # One step, two authentication routes, one set of bytes.
      #
      # **The steady state: Trusted Publishing, no flag and no token.** npm
      # exchanges the job's OIDC token for a short-lived publish credential and
      # generates and publishes the provenance attestation on its own, so
      # `--provenance` is not passed: under Trusted Publishing the flag is
      # redundant, and there is no long-lived credential to rotate or to leak.
      # npmjs.com decides which workflow in which repository may publish.
      #
      # **The first release: a token, and `--provenance` spelled out.** A
      # trusted publisher can only be attached to a package that already exists
      # on the registry, so the first version has to go up some other way, and
      # the way it goes up decides whether the artefact everybody installs first
      # is the only one without a provenance statement. It goes up from here.
      # The token authenticates; `--provenance` makes npm mint and attach the
      # statement over the same GitHub OIDC identity, which is why this job holds
      # `id-token: write` on both routes. `--access public` is not decoration
      # here but required: before signing, npm asks the registry whether the
      # package is public, a question a package that does not exist yet cannot
      # answer, and without the flag it refuses with "Can't generate provenance
      # for new or private package, you must set `access` to public."
      #
      # The tarball is the same one either way: the artefact `check-npm` packed,
      # installed into a clean directory and imported, in this same run. Nothing
      # here checks out the source or builds, so there is no second tarball for
      # this step to reach for by mistake.
      #
      # The token reaches npm through a config file written for this one
      # command, mode 0600, removed by a trap whether the publish succeeds or
      # fails, rather than through the `registry-url:` form the setup-node step
      # above rejects. Under `NPM_CONFIG_USERCONFIG` the two routes cannot
      # reach each other's credentials, and no auth line outlives the command
      # that needed it.
      #
      # npm 11 does try the OIDC exchange first even with a token configured.
      # For a package with no trusted publisher the exchange fails, and npm's
      # own helper is written never to throw on that. It logs, it leaves the
      # configured token in place, and the bootstrap proceeds on the token.
      #
      # The version may already be on the registry for one legitimate reason: a
      # re-run of a tag whose publish already succeeded. Publishing it a second
      # time would fail and, because publish-pypi and publish-crates chain off
      # this job, take PyPI and crates.io down with it. So when the version
      # exists, this job verifies that what is published is the artefact CI
      # checked (npm records the tarball's sha1 as `dist.shasum`) and succeeds
      # without sending anything. A shasum mismatch is the one thing that must
      # never pass: it means the bytes on the registry are not the bytes this
      # run verified.
      - name: Publish the tarball check-npm packed
        run: |
          set -euo pipefail
          npmrc="$RUNNER_TEMP/npmrc-bootstrap"
          trap 'rm -f "$npmrc"' EXIT

          tarball=$(ls npm-tarball/*.tgz)
          version="${GITHUB_REF_NAME#v}"
          echo "loudkit@$version from $tarball"
          sha256sum "$tarball"
          npm --version

          published=$(npm view "loudkit@$version" dist.shasum 2>/dev/null || true)
          if [ -n "$published" ]; then
            local=$(shasum -a 1 "$tarball" | cut -d' ' -f1)
            if [ "$published" != "$local" ]; then
              echo "loudkit@$version is already on the registry with shasum $published," >&2
              echo "but the tarball this run checked has shasum $local." >&2
              echo "The registry holds bytes this workflow never verified. Stopping." >&2
              exit 1
            fi
            echo "loudkit@$version is already published and its shasum matches the"
            echo "tarball this run checked: nothing to send."
            exit 0
          fi

          if [ -n "${NPM_BOOTSTRAP_TOKEN:-}" ]; then
            echo "NPM_BOOTSTRAP_TOKEN is set: this is the first publish of this"
            echo "package, over a granular token, with provenance."
            ( umask 077 && printf '//registry.npmjs.org/:_authToken=%s\n' \
                "$NPM_BOOTSTRAP_TOKEN" > "$npmrc" )
            NPM_CONFIG_USERCONFIG="$npmrc" \
              npm publish --provenance --access public "$tarball"
            echo "Published with provenance. Configure the trusted publisher on the"
            echo "package now, then delete this secret and revoke the token"
            echo "(RELEASING.md §7.1). The next release must not find it here."
          else
            echo "No bootstrap token: publishing over Trusted Publishing."
            npm publish --access public "$tarball"
          fi

  publish-pypi:
    name: publish to PyPI
    needs: publish-npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write     # Trusted Publishing; no API token is stored
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # Named rather than left to the default, so it stays visible that
          # this directory is uploaded whole and may hold only distributions.
          packages-dir: dist

  publish-crates:
    name: publish to crates.io
    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: stable

      # No `--no-verify`. crates.io has no "upload this file I already built"
      # call, so this job has to repackage rather than receive the `.crate`
      # that check-crates inspected — and a second packaging run is a second
      # set of bytes unless something builds them. Verification is that
      # something: cargo packages, unpacks its own tarball, and compiles it,
      # and only then uploads. The crate that reaches crates.io has therefore
      # been built from its own contents on this runner, moments earlier.
      #
      # It is the same compile check-crates already passed, so the expected
      # outcome is a slower job and no new information. That is the point: the
      # one run where it disagrees is the run where the checkout and the
      # tarball drifted apart, and it happens before the upload rather than
      # after, which is the only side of the upload where it can be fixed.
      - name: Publish
        working-directory: rust
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # --- the record ------------------------------------------------------------

  github-release:
    name: create the GitHub Release
    needs: publish-crates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job that writes to the repository, and the only one that needs
    # this permission.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: sbom
          path: sbom

      - name: Upload the artefacts to the tag's Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            dist/*
            sbom/*
          generate_release_notes: true
