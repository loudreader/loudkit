# Dependency and GitHub Actions updates, checked weekly.
#
# CI pins its actions by SHA, which is the right call and also a standing cost:
# a pinned action never updates itself, so a security release sits unnoticed
# until somebody looks. This is what looks.
#
# Weekly rather than daily: this is a small project and a pull request a day is
# a pull request nobody reads.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    # `ruff` is pinned exactly on purpose: two versions that both "pass" still
    # disagree about bytes, so a formatter that updates itself makes CI's
    # verdict depend on the morning it ran. Raise the pin deliberately, in its
    # own commit, with the reformat it causes.
    ignore:
      - dependency-name: ruff

  - package-ecosystem: npm
    directory: /js
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  # The documentation site is npm too, and it builds and publishes a public
  # page, so a vulnerable transitive dependency there is as reachable as one in
  # the library.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
