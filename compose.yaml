# One loudkit server. The `VARIANT` build argument selects the backend.
#
# `VARIANT` sets the image and the server's `--device`, because the onnx image
# has no torch. `LOUDKIT_DEVICE` overrides only `--device` (`cuda:1`, or `cpu`
# for a cuda image with no GPU visible).
#
# Point LOUDKIT_CHECKPOINTS at the directory with the weights. The image does
# not include them: the 747 MB synthesis checkpoint is versioned separately.
#
# LOUDKIT_TOKEN is required. A port mapping cannot reach the container's own
# loopback, so the server binds 0.0.0.0. The server treats any non-loopback
# bind as public, which needs `--allow-public` and a bearer token. A token the
# server generates goes to its log, and the healthcheck cannot read it.
#
# The `127.0.0.1:` on the left of the port mapping below limits access to this
# machine. The server cannot see that from inside the container, so it still
# requires the token.
#
# docs/platforms/docker.md has the commands and the full variable table.

services:
  loudkit:
    build:
      context: .
      args:
        VARIANT: ${VARIANT:-cpu}
    image: loudkit:${VARIANT:-cpu}
    # Reachable from this machine only. Without the `127.0.0.1:` prefix the
    # port is published on every interface, and the bearer token is the only
    # access control. The server speaks plain HTTP, so the token crosses the
    # network unencrypted. Read the TLS note in
    # `docs/guides/04-server-and-agents.md` before you change this.
    ports:
      - "127.0.0.1:8000:8000"
    # The process reads a checkpoint and answers on a socket. It needs no
    # capability and no setuid binary. The root filesystem is read-only. The
    # paths not mounted read-only are the hub cache volume below and `/tmp`, a
    # tmpfs for the scratch space of the interpreter and libsndfile.
    # `PYTHONDONTWRITEBYTECODE=1` in the image keeps `__pycache__` out of the
    # read-only venv.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${LOUDKIT_CHECKPOINTS:-./checkpoints}:/weights:ro
      # Voices are small and read-only too.
      - ${LOUDKIT_VOICES:-./voices}:/voices:ro
      # The Hugging Face cache, for a `--checkpoint` that names a repo id
      # instead of a mounted file.
      - loudkit-hub:/home/loudkit/.cache/huggingface
    # Passed to the server and to the healthcheck, which needs the same token
    # as every other route. The server skips its startup warm-up for any
    # non-empty LOUDKIT_NO_WARM, `0` included.
    environment:
      LOUDKIT_NO_WARM: ${LOUDKIT_NO_WARM:-0}
      LOUDKIT_TOKEN: ${LOUDKIT_TOKEN:?set LOUDKIT_TOKEN, e.g. export LOUDKIT_TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')}
    command:
      - serve
      - --checkpoint=/weights/${LOUDKIT_MODEL_FILE:-loudr-1.safetensors}
      - --voices=/voices
      # Inside the container only; the port mapping above limits access.
      - --host=0.0.0.0
      # The server's own default is 8765. Without this flag nothing listens on
      # the mapped port, and the container still starts.
      - --port=8000
      # The server treats 0.0.0.0 as a public bind, and a public bind requires
      # a bearer token.
      - --allow-public
      # The token comes from $LOUDKIT_TOKEN through the CLI's environment
      # fallback. On the command line, `ps` would show it to every account on
      # the host.
      #
      # The device follows the variant: the onnx image has no torch and needs
      # `--device onnx`. `VARIANT` and `--device` share their values (cpu,
      # cuda, onnx). `LOUDKIT_DEVICE` overrides the device: `cpu` for a cuda
      # image on a host with no GPU, or `cuda:1` for a specific card.
      - --device=${LOUDKIT_DEVICE:-${VARIANT:-cpu}}
    # A CPU render peaks around 3 GB. Over this limit the kernel's OOM killer
    # stops the process. Raise it for a larger model or workload.
    deploy:
      resources:
        limits:
          memory: 6g

volumes:
  loudkit-hub:
