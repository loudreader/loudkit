# Speech Dispatcher module configuration for loudkit.
#
# Copy to ~/.config/speech-dispatcher/modules/loudkit.conf and register the
# module in speechd.conf:
#
#     AddModule "loudkit" "loudkit-speechd.py" "loudkit.conf"
#
# The module forwards to a running `loudkit serve`; it does not load the model
# itself. A module that loaded a 747 MB checkpoint per utterance would make
# every menu item take six seconds.
#
# These settings are read by the module; the LOUDKIT_SERVER / LOUDKIT_VOICE /
# LOUDKIT_PLAYER / LOUDKIT_TOKEN environment variables override them.

LoudkitServer "http://127.0.0.1:8765"
LoudkitVoice  "kathleen"
LoudkitPlayer "paplay"

# Required only when the server was started with --allow-public, which refuses
# to run without a token. A loopback server needs none.
# LoudkitToken ""

# The shipped roster, from docs/voices/roster/provenance.json. One line per
# profile so LIST VOICES offers every language to the user. The generic module
# knows three symbolic names per gender, so English lists six of its ten voices;
# any of the 28 can still be named directly.
AddVoice "pl" "MALE1" "darkman"
AddVoice "pl" "FEMALE1" "gosia"
AddVoice "en" "MALE1" "joe"
AddVoice "en" "FEMALE1" "kathleen"
AddVoice "en" "MALE2" "oscar"
AddVoice "en" "FEMALE2" "sophie"
AddVoice "en" "MALE3" "henry"
AddVoice "en" "FEMALE3" "emma"
AddVoice "de" "MALE1" "thorsten"
AddVoice "de" "FEMALE1" "kerstin"
AddVoice "fr" "MALE1" "henri"
AddVoice "fr" "FEMALE1" "colette"
AddVoice "nl" "MALE1" "pim"
AddVoice "nl" "FEMALE1" "nathalie"
AddVoice "es" "MALE1" "dave"
AddVoice "es" "FEMALE1" "carmen"
AddVoice "it" "MALE1" "dante"
AddVoice "it" "FEMALE1" "paola"
AddVoice "pt" "MALE1" "tugao"
AddVoice "pt" "FEMALE1" "ines"
AddVoice "sv" "MALE1" "nils"
AddVoice "sv" "FEMALE1" "selma"
AddVoice "da" "MALE1" "soren"
AddVoice "da" "FEMALE1" "freja"
